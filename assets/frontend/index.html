<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora de Churrasco</title>
    <style>
      :root {
        --bg: #fbf7f2;
        --surface: #ffffff;
        --text: #2a1d14;
        --muted: #7a6656;
        --border: #eaded2;
        --accent: #c2410c;
        --accent-hover: #9a3412;
        --accent-soft: #fdebdc;
        --danger: #b91c1c;
        --danger-soft: #fde8e8;
        --shadow: 0 20px 40px -24px rgba(74, 38, 12, 0.35);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17110d;
          --surface: #221a14;
          --text: #f6ede4;
          --muted: #b4a191;
          --border: #3a2d23;
          --accent: #fb923c;
          --accent-hover: #fdba74;
          --accent-soft: #3b2415;
          --danger: #fca5a5;
          --danger-soft: #3a1b1b;
          --shadow: 0 20px 40px -24px rgba(0, 0, 0, 0.7);
        }
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }

      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 3rem 1rem 4rem;
      }

      header { text-align: center; margin-bottom: 2rem; }
      .emoji { font-size: 3rem; line-height: 1; }
      h1 { font-size: 2rem; margin: 0.75rem 0 0.25rem; letter-spacing: -0.02em; }
      .lead { color: var(--muted); }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1.5rem;
        box-shadow: var(--shadow);
      }

      form .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }
      label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem; }
      input {
        width: 100%;
        font: inherit;
        font-size: 1.1rem;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
        color: var(--text);
        outline: none;
      }
      input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

      button {
        width: 100%;
        font: inherit;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover { background: var(--accent-hover); }
      button:disabled { opacity: 0.6; cursor: wait; }
      @media (prefers-color-scheme: dark) { button { color: #1c120b; } }

      .result { margin-top: 1.5rem; }
      .result[hidden] { display: none; }
      .result h2 { font-size: 1.15rem; margin-bottom: 0.25rem; }
      .result .for { color: var(--muted); font-size: 0.95rem; margin-bottom: 1rem; }

      .list { list-style: none; }
      .list li {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 0;
        border-top: 1px dashed var(--border);
      }
      .list li:first-child { border-top: none; }
      .list .icon {
        flex: none;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        background: var(--accent-soft);
      }
      .list .item { flex: 1; min-width: 0; }
      .list .name { font-weight: 600; }
      .list .note { color: var(--muted); font-size: 0.85rem; }
      .list .qty { font-weight: 700; font-size: 1.15rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

      .error {
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 0.95rem;
      }
      .error[hidden] { display: none; }

      footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }

      @media (max-width: 420px) {
        form .fields { grid-template-columns: 1fr; }
        h1 { font-size: 1.6rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="emoji" aria-hidden="true">🔥</div>
        <h1>Calculadora de Churrasco</h1>
        <p class="lead">Diga quantas pessoas vêm e veja o que comprar.</p>
      </header>

      <section class="card">
        <form id="form">
          <div class="fields">
            <div>
              <label for="adultos">Adultos</label>
              <input id="adultos" name="adultos" type="number" inputmode="numeric" min="0" step="1" value="10" required />
            </div>
            <div>
              <label for="criancas">Crianças</label>
              <input id="criancas" name="criancas" type="number" inputmode="numeric" min="0" step="1" value="0" required />
            </div>
          </div>
          <button type="submit" id="calcular">Calcular</button>
        </form>

        <p class="error" id="erro" role="alert" hidden></p>

        <div class="result" id="resultado" aria-live="polite" hidden>
          <h2>Lista de compras</h2>
          <p class="for" id="para"></p>
          <ul class="list">
            <li>
              <span class="icon" aria-hidden="true">🥩</span>
              <span class="item">
                <span class="name">Carne</span><br />
                <span class="note" id="carne-nota"></span>
              </span>
              <span class="qty" id="carne"></span>
            </li>
            <li>
              <span class="icon" aria-hidden="true">🍺</span>
              <span class="item">
                <span class="name">Cerveja</span><br />
                <span class="note" id="cervejas-nota"></span>
              </span>
              <span class="qty" id="cervejas"></span>
            </li>
          </ul>
        </div>
      </section>

      <footer>400 g de carne e 6 latas por adulto, 200 g de carne por criança.</footer>
    </main>

    <script>
      // Conta este acesso para as estatísticas do backoffice.
      fetch("/visita", { method: "POST" }).catch(function () {});

      var form = document.getElementById("form");
      var botao = document.getElementById("calcular");
      var erro = document.getElementById("erro");
      var resultado = document.getElementById("resultado");
      var numero = new Intl.NumberFormat("pt-BR");
      var kg = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 });

      function plural(n, um, varios) {
        return numero.format(n) + " " + (n === 1 ? um : varios);
      }

      function mostrarErro(texto) {
        resultado.hidden = true;
        erro.textContent = texto;
        erro.hidden = false;
      }

      form.addEventListener("submit", function (evento) {
        evento.preventDefault();
        var adultos = parseInt(form.adultos.value, 10);
        var criancas = parseInt(form.criancas.value, 10);
        if (isNaN(adultos) || isNaN(criancas) || adultos < 0 || criancas < 0) {
          mostrarErro("Informe números inteiros, zero ou mais, de adultos e crianças.");
          return;
        }
        if (adultos + criancas === 0) {
          mostrarErro("Convide pelo menos uma pessoa para o churrasco.");
          return;
        }

        botao.disabled = true;
        botao.textContent = "Calculando…";
        var query = new URLSearchParams({ adultos: adultos, criancas: criancas });

        fetch("/churrasco?" + query.toString())
          .then(function (resposta) {
            if (!resposta.ok) throw new Error("status " + resposta.status);
            return resposta.json();
          })
          .then(function (dados) {
            erro.hidden = true;
            var pessoas = [plural(adultos, "adulto", "adultos")];
            if (criancas > 0) pessoas.push(plural(criancas, "criança", "crianças"));
            document.getElementById("para").textContent = "Para " + pessoas.join(" e ") + ".";

            var gramas = dados.carne_g;
            document.getElementById("carne").textContent =
              gramas >= 1000 ? kg.format(gramas / 1000) + " kg" : numero.format(gramas) + " g";
            document.getElementById("carne-nota").textContent =
              gramas >= 1000 ? numero.format(gramas) + " g no total" : "no total";

            var latas = dados.cervejas;
            document.getElementById("cervejas").textContent = plural(latas, "lata", "latas");
            document.getElementById("cervejas-nota").textContent =
              latas === 0 ? "só tem criança: capriche no refrigerante" :
              "cerca de " + plural(Math.ceil(latas / 12), "fardo", "fardos") + " de 12";

            resultado.hidden = false;
          })
          .catch(function () {
            mostrarErro("Não foi possível calcular agora. Tente de novo em instantes.");
          })
          .finally(function () {
            botao.disabled = false;
            botao.textContent = "Calcular";
          });
      });
    </script>
  </body>
</html>
